<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STORA has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // The beta became the main app. Remove the beta service worker, then go to /Stora/.
  (async function () {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(function (r) { return r.scope.indexOf('/Stora/beta/') !== -1; }).map(function (r) { return r.unregister(); }));
      }
      if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.filter(function (k) { return k.indexOf('stora-3.0.0-beta') === 0; }).map(function (k) { return caches.delete(k); })); }
    } catch (e) {}
    location.replace('/Stora/' + location.hash);
  })();
</script>
<style>body{margin:0;background:#0A0E17;color:#C9D3DF;font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}a{color:#89BEF6}</style>
</head>
<body><p>STORA has moved to <a href="/Stora/">eng-md-hub.github.io/Stora</a></p></body>
</html>
