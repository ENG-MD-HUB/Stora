name: Build STORA

# Builds the source in app/ and publishes it at the repository root (served at /Stora/).
# The archived 2.x app lives in v2/ and the old beta link in beta/ only redirects.
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Publish build at the site root
        run: |
          rm -rf assets brand templates icons
          cp -r app/dist/. .
      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest assets brand templates icons
          git diff --cached --quiet || git commit -m "Build STORA from app/ [skip ci]"
          git push
